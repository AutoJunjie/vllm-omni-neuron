# HunyuanImage-3.0-Instruct DiT-only text-to-image on one trn2.48xlarge.
#
# TP16 = 16 logical NeuronCores (4 Trainium2 chips at NEURON_LOGICAL_NC_CONFIG=2).
# Attention is head-parallel and the 64 routed experts are expert-parallel (4 per
# rank), which keeps the 80B BF16 checkpoint at ~10 GB of weights per core.
#
# `devices` is the *visible* core range. Point it at whichever cores are free on the
# instance (e.g. "48-63" when another service holds 0-47).
stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      devices: "0-15"
      max_batch_size: 1
    engine_args:
      model_class_name: HunyuanImage3ForCausalMM
      model_stage: diffusion
      dtype: bfloat16
      trust_remote_code: true
      model_config:
        # Prompt bucket. The prefill graph is compiled for this length and the prompt
        # is right-padded to it; a different value is a separate (one-off) compile.
        prefill_len: 512
        # `nki` runs the routed/shared MLPs through the NKI-Lib SwiGLU kernel;
        # `torch` falls back to plain matmuls (useful for bisecting accuracy).
        moe_kernel: nki
        # The VAE decodes on the host; float32 matches the reference decoder.
        vae_dtype: float32
      parallel_config:
        tensor_parallel_size: 16
        cfg_parallel_size: 1
        ring_degree: 1
        vae_patch_parallel_size: 1
